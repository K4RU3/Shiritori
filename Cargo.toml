[package]
name = "shiritori_v4"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "2.0.1"
chrono = "0.4.41"
dotenv = "0.15.0"
lazy_static = "1.5.0"
regex = "1.11.2"
rand = "0.9"
serde = {version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serenity = "0.12.4"
thiserror = "2.0.16"
tokio = {version = "1.47.1", features = ["full"] }

[dependencies.axum]
version = "0.8"
features = ["multipart"]

[target.'cfg(not(target_os = "windows"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"], optional = true }

[dev-dependencies]
tower = "0.5"
